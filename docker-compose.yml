services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: travel-bug-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: travelbug
      POSTGRES_PASSWORD: travelbug
      POSTGRES_DB: travelbug
    volumes:
      - travel_bug_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelbug -d travelbug"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: travel-bug-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - travel_bug_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  travel_bug_pgdata:
  travel_bug_redis:
